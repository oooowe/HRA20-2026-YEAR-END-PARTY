<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HRA 20 마법사의 밤</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#eee;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #deck{position:fixed;inset:0}
  .slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000}
  .slide.on{display:flex}
  /* 이미지 슬라이드: 16:9 무대에 맞춤 */
  .stage{position:relative;width:min(100vw,177.778vh);height:min(56.25vw,100vh)}
  .stage>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .qr{position:absolute;left:50%;top:33%;height:58%;transform:translateX(-50%);aspect-ratio:1;
    background:#fff;padding:1.2%;box-sizing:border-box;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.25)}
  .qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
  /* 전체 화면 임베드 */
  .slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b0f1a}
  .stage iframe.pane{inset:auto;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28);background:#1b1d22}
  .slide video{width:100%;height:100%;object-fit:contain;background:#000;cursor:pointer}
  .offline{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;text-align:center;
    background:rgba(10,14,26,.92);border:1px solid #c9a45c;color:#f1e3c2;padding:24px 32px;border-radius:12px;font-size:18px;line-height:1.6;z-index:2}
  body.is-offline .offline{display:block}
  /* 좌우 넘기기 버튼: 가장자리에 마우스를 올리면 나타남 */
  .edge{position:fixed;top:0;bottom:0;width:72px;z-index:10;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .edge.l{left:0}.edge.r{right:0}
  .edge span{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transition:opacity .2s}
  .edge:hover span{opacity:1}
  #hud{position:fixed;right:14px;bottom:12px;z-index:11;display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .25s;
    font-size:13px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);padding:5px 10px;border-radius:16px}
  #hud.show,#hud:hover{opacity:1}
  #hud button{background:none;border:0;color:#eee;font-size:13px;cursor:pointer;padding:0 2px}
  #sink{position:fixed;width:1px;height:1px;opacity:0;outline:none}
</style>
</head>
<body>
<div id="sink" tabindex="-1"></div>
<div id="deck"></div>
<div class="edge l" id="prevBtn" title="이전 (←)"><span>◀</span></div>
<div class="edge r" id="nextBtn" title="다음 (→)"><span>▶</span></div>
<div id="hud"><span id="num"></span><button id="fsBtn" title="전체 화면 (F)">⛶ 전체 화면</button></div>

<script>
const INVITE='https://a01099226860-tech.github.io/HRA-HAPPY-YEAR/';
/* 슬라이드 목록 — 원본 PDF 27페이지 + 초대장 사이트 + 카훗 퀴즈 − 18·19p + 롤링페이퍼 = 28장
   img: PDF 페이지 이미지 / web: 전체 화면 사이트 / motion: 동선 모션 / video: 영상 / qr: 이미지 위 QR */
const SLIDES = [
  {img:'01'},
  {img:'02', prefetch:[INVITE+'assets/intro.mp4?v=2', INVITE+'assets/intro-bgm.wav?v=1']},
  {web:INVITE, fresh:true},   // 들어올 때마다 새로 불러 인트로 영상 소리가 바로 나오게, 떠나면 닫아서 소리(BGM) 끔
  {img:'03'},
  {motion:'motion.html'},
  {video:'video.mp4'},
  {img:'06'},{img:'07'},{img:'08'},{img:'09'},{img:'10'},
  {img:'11', qr:'qr.png'},
  {web:'https://eunzisi.github.io/hp-quiz/'},
  {img:'12'},{img:'13'},{img:'14'},{img:'15'},{img:'16'},{img:'17'},
  {web:INVITE+'letters.html'},   // 원본 18·19p(부엉이 편지 화면 캡처) 대신 실제 롤링페이퍼 페이지
  {img:'20'},{img:'21'},{img:'22'},{img:'23'},{img:'24'},
  {img:'25', fresh:true, frames:[            // 공간배치: 왼쪽 기존 장소 3D → 오른쪽 케이터링 배치 3D (마우스로 돌려보기)
    {src:'venue.html',    l:3,  t:30, w:42, h:66},
    {src:'catering.html', l:55, t:30, w:42, h:66}]},
  {img:'26'},{img:'27'}
];

const deck=document.getElementById('deck'), sink=document.getElementById('sink');
const els=SLIDES.map(s=>{
  const d=document.createElement('section');d.className='slide';
  if(s.img){
    const st=document.createElement('div');st.className='stage';
    st.innerHTML=`<img class="bg" src="slides/${s.img}.jpg" alt="">`+(s.qr?`<div class="qr"><img src="${s.qr}" alt="카훗 QR 코드"></div>`:'');
    (s.frames||[]).forEach(fr=>{
      const f=document.createElement('iframe');f.className='pane';f.dataset.src=fr.src;
      f.style.cssText=`left:${fr.l}%;top:${fr.t}%;width:${fr.w}%;height:${fr.h}%`;
      f.addEventListener('mouseleave',()=>sink.focus());
      st.appendChild(f);
    });
    d.appendChild(st);
  }else if(s.web||s.motion){
    const f=document.createElement('iframe');
    f.dataset.src=s.web||s.motion;
    f.allow='autoplay; fullscreen; clipboard-write';
    f.addEventListener('mouseleave',()=>sink.focus());   // 사이트에서 마우스가 나오면 키보드를 다시 슬라이드로
    d.appendChild(f);
    if(s.web){const o=document.createElement('div');o.className='offline';
      o.innerHTML='인터넷 연결이 필요한 페이지예요.<br>와이파이 연결을 확인해 주세요.';d.appendChild(o);}
  }else if(s.video){
    const v=document.createElement('video');v.src=s.video;v.preload='auto';v.playsInline=true;
    v.addEventListener('click',()=>v.paused?v.play():v.pause());
    d.appendChild(v);
  }
  deck.appendChild(d);return d;
});

let cur=-1;
function loadFrame(i){const f=els[i]&&els[i].querySelector('iframe');if(f&&!f.dataset.loaded){f.src=f.dataset.src;f.dataset.loaded='1';}}
function go(i){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  if(i===cur)return;
  const prev=cur;cur=i;
  if(prev>=0){
    els[prev].classList.remove('on');
    const v=els[prev].querySelector('video');if(v)v.pause();
    if(SLIDES[prev].fresh)els[prev].querySelectorAll('iframe').forEach(f=>{f.src='about:blank';f.dataset.loaded='';});
  }
  els[i].classList.add('on');
  const s=SLIDES[i];
  if(s.fresh)els[i].querySelectorAll('iframe').forEach(f=>{f.src=f.dataset.src;f.dataset.loaded='1';});
  else loadFrame(i);
  if(SLIDES[i+1]&&!SLIDES[i+1].fresh)loadFrame(i+1);  // 다음 장 사이트는 미리 불러 둠(소리 나는 초대장은 제외)
  if(s.prefetch)s.prefetch.forEach(u=>fetch(u,{mode:'no-cors'}).catch(()=>{}));  // 초대장 영상·음원을 미리 받아 둠
  if(s.motion){const f=els[i].querySelector('iframe');try{f.contentWindow.postMessage({motion:'reset'},'*');}catch(e){}}
  if(s.video){const v=els[i].querySelector('video');v.currentTime=0;v.muted=false;
    v.play().catch(()=>{v.muted=true;v.play();});}   // 소리 재생이 막히면 음소거로라도 재생
  sink.focus();
  document.getElementById('num').textContent=`${i+1} / ${SLIDES.length}`;
  const hud=document.getElementById('hud');hud.classList.add('show');clearTimeout(go.t);go.t=setTimeout(()=>hud.classList.remove('show'),1500);
  history.replaceState(null,'','#'+(i+1));
}
function next(){
  if(SLIDES[cur].motion){                            // 동선 모션은 장면을 다 보여준 뒤 다음 슬라이드로
    els[cur].querySelector('iframe').contentWindow.postMessage({motion:'next'},'*');return;
  }
  go(cur+1);
}
function prev(){go(cur-1);}
function toggleFS(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}

addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(SLIDES.length-1);
  else if(e.key==='f'||e.key==='F')toggleFS();
});
addEventListener('message',e=>{const d=e.data||{};
  if(d.deck==='next')go(cur+1);else if(d.deck==='prev')prev();else if(d.deck==='fullscreen')toggleFS();});
document.getElementById('prevBtn').onclick=prev;
document.getElementById('nextBtn').onclick=()=>go(cur+1);   // 오른쪽 ▶ 버튼은 동선 모션 중에도 바로 다음 슬라이드로
document.getElementById('fsBtn').onclick=toggleFS;
const net=()=>document.body.classList.toggle('is-offline',!navigator.onLine);
addEventListener('online',net);addEventListener('offline',net);net();

SLIDES.forEach((s,i)=>{if(s.web&&!s.fresh)loadFrame(i);});   // 외부 사이트는 처음부터 미리 불러 둠(넘기자마자 바로 보이게)
const fromHash=()=>go((parseInt(location.hash.slice(1))||1)-1);
addEventListener('hashchange',fromHash);
fromHash();
</script>
</body>
</html>
